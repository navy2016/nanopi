name: build-aarch64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build linux-aarch64-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl

      - name: install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build release
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: stage asset
        shell: bash
        run: |
          set -eux
          SRC="target/aarch64-unknown-linux-musl/release/nanopi"
          OUT="nanopi-linux-aarch64-musl"
          mkdir -p dist
          cp "$SRC" "dist/$OUT"
          strip "dist/$OUT" || true
          ls -lh "dist/$OUT"

      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          TAG="v0.10.0-aarch64"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/nanopi-linux-aarch64-musl \
            --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name'
